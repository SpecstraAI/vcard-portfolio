<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>

  <link rel="shortcut icon" href="/vcard-portfolio/assets/images/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="/vcard-portfolio/assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .not-found {
      max-width: 480px;
      width: 100%;
      background: var(--border-gradient-onyx);
      border: 1px solid var(--jet);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: var(--shadow-2);
    }

    .not-found-code {
      font-size: 80px;
      font-weight: var(--fw-700, 700);
      color: var(--orange-yellow-crayola);
      line-height: 1;
      margin-bottom: 10px;
    }

    .not-found-title {
      font-size: var(--fs-3, 20px);
      font-weight: var(--fw-500, 500);
      color: var(--white-2, #e4e3e3);
      margin-bottom: 16px;
    }

    .not-found-text {
      font-size: var(--fs-6, 14px);
      color: var(--light-gray, #a8a8b3);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .not-found-link {
      display: inline-block;
      background: var(--bg-gradient-yellow-1);
      color: var(--smoky-black, #1a1a1a);
      font-size: var(--fs-6, 14px);
      font-weight: var(--fw-600, 600);
      padding: 12px 28px;
      border-radius: 14px;
      text-decoration: none;
      transition: var(--transition-1);
    }

    .not-found-link:hover {
      background: var(--bg-gradient-yellow-2);
    }
  </style>
</head>

<body>

  <div class="not-found">
    <p class="not-found-code">404</p>
    <h1 class="not-found-title">Page not found</h1>
    <p class="not-found-text">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/vcard-portfolio/" class="not-found-link">Back to portfolio</a>
  </div>

</body>

</html>
